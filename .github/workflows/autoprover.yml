# prove2me-autoprover: GitHub Actions route (the fallback to the Claude Code routine).
#
# UNTESTED FALLBACK. It does NOT use the data-repo layout of the routine: it runs in
# your own copy (fork) of this repo, which then plays both roles. Put your
# autoprover.config.json at the root of that copy; logs go to the `autoprover-log`
# branch (logs/ is gitignored on main, hence `git add -f` below).
#
# What this does, in plain words:
#   On a schedule (or when you click "Run workflow"), a fresh Ubuntu machine
#   installs Lean + Mathlib, then runs Claude Code (via anthropics/claude-code-action)
#   with the instructions in prompts/routine.md. Claude picks a few open Prove2me
#   claims and tries to prove them. scripts/p2m.py enforces the safety rules
#   (dry run, submission caps, "only submit what compiles"). Afterwards the run
#   log is shown on the run page, committed to the `autoprover-log` branch, and
#   any dry-run solutions are attached to the run as a downloadable artifact.
#
# One-time setup (Settings -> Secrets and variables -> Actions):
#   Secrets
#     CLAUDE_CODE_OAUTH_TOKEN  output of `claude setup-token` (uses your Claude subscription)
#     PROVE2ME_CREDENTIALS     the whole credentials.json, e.g. {"api_key": "p2m_..."}
#   Variables (all optional)
#     AUTOPROVER_LIVE          'true' = scheduled runs really submit. Anything else = dry run.
#     AUTOPROVER_MODEL         Claude model alias or id (default: opus)
#     AUTOPROVER_MAX_CLAIMS    claims per scheduled run (default: autoprover.config.json)
#     AUTOPROVER_MAX_SUBMISSIONS  submissions per run (default: autoprover.config.json)
#     AUTOPROVER_MAX_BUDGET_USD   soft cap on Claude Code's *estimated* USD spend (default: 50)
#
# Secrets are never printed: they are only handed to the steps that need them,
# and scripts/prepare.sh writes the Prove2me key to a file without echoing it.

name: autoprover

on:
  schedule:
    # Cron times are UTC. Regenerate both lines with:
    #     python3 scripts/p2m.py schedule
    # (from autoprover.config.json: weekly_reset + lead_hours). The values below were
    # generated for "thursday 10:00 Asia/Jerusalem", lead hours [10, 5], during Israeli
    # summer time (IDT). After the clocks change, rerun the command and update them.
    # GitHub often starts scheduled runs 10-30+ minutes late; that is expected.
    - cron: "7 21 * * 3"   # 10 h before the weekly reset (Wed 21:07 UTC)
    - cron: "7 2 * * 4"    #  5 h before the weekly reset (Thu 02:07 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check proofs locally but do NOT submit to Prove2me"
        type: boolean
        default: true
      max_claims:
        description: "Maximum number of claims to attempt"
        type: string
        default: "3"
      model:
        description: "Claude model (blank = repo variable AUTOPROVER_MODEL, else 'opus')"
        type: string
        default: ""

# Never run two autoprover jobs at once (they would race on claims and on the log
# branch). A new run waits for the current one instead of cancelling it.
concurrency:
  group: autoprover
  cancel-in-progress: false

# Default for every job: read-only. Only the small `publish-log` job gets write access.
permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    # Hard ceiling for the whole job (GitHub's own maximum is 360 min).
    timeout-minutes: 300
    # Read-only token: the agent (which has a shell) cannot push anything.
    # id-token: write is NOT needed, because we pass github_token to the action
    # below, which skips the Claude GitHub App / OIDC token exchange.
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.collect.outputs.run_id }}
    env:
      # This checkout is both the tool and the data repo (see the header).
      AUTOPROVER_TOOL: ${{ github.workspace }}
      AUTOPROVER_DATA: ${{ github.workspace }}
      AUTOPROVER_STATE: ${{ github.workspace }}/.autoprover
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------- mode
      - name: Decide mode (dry run or live) and limits
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          IN_DRY: ${{ inputs.dry_run }}
          LIVE: ${{ vars.AUTOPROVER_LIVE }}
          IN_MAX_CLAIMS: ${{ inputs.max_claims }}
          VAR_MAX_CLAIMS: ${{ vars.AUTOPROVER_MAX_CLAIMS }}
          VAR_MAX_SUBS: ${{ vars.AUTOPROVER_MAX_SUBMISSIONS }}
          MODEL: ${{ inputs.model || vars.AUTOPROVER_MODEL || 'opus' }}
        run: |
          # Manual runs: the checkbox decides. Scheduled runs: dry run unless the
          # repository variable AUTOPROVER_LIVE is exactly 'true' (explicit opt-in).
          if [ "$EVENT" = "workflow_dispatch" ]; then
            DRY="$IN_DRY"; MAX_CLAIMS="$IN_MAX_CLAIMS"
          else
            if [ "$LIVE" = "true" ]; then DRY=false; else DRY=true; fi
            MAX_CLAIMS="$VAR_MAX_CLAIMS"    # empty = use autoprover.config.json
          fi
          [ "$DRY" = "false" ] || DRY=true  # anything unexpected means dry run
          WS="$HOME/prove2me_workspace"
          # $GITHUB_ENV makes these visible to every later step, including Claude's
          # shell; scripts/p2m.py reads them as overrides of autoprover.config.json.
          {
            echo "PROVE2ME_WORKSPACE=$WS"
            echo "AUTOPROVER_DRY_RUN=$DRY"
            echo "AUTOPROVER_MAX_CLAIMS_PER_RUN=$MAX_CLAIMS"
            echo "AUTOPROVER_MAX_SUBMISSIONS_PER_RUN=$VAR_MAX_SUBS"
          } >> "$GITHUB_ENV"
          {
            echo "dry_run=$DRY"
            echo "workspace=$WS"
            echo "model=$MODEL"
          } >> "$GITHUB_OUTPUT"
          if [ "$DRY" = "true" ]; then M="DRY RUN (nothing will be submitted)"; else M="LIVE (proofs that pass local checks are submitted)"; fi
          echo "## prove2me-autoprover" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: **$M**, model \`$MODEL\`, max claims: ${MAX_CLAIMS:-config default}" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $M; model $MODEL; max claims ${MAX_CLAIMS:-config default}"

      # ---------------------------------------------------------------- disk
      # Mathlib's prebuilt cache is ~5 GB unpacked, and the Actions cache keeps a
      # second compressed copy. ubuntu-latest has limited free disk, so delete
      # preinstalled toolchains this job never uses (the machine is thrown away
      # after the run, so this affects nothing else).
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1

      # ---------------------------------------------------------------- Lean
      # Clone the Prove2me workspace BEFORE restoring the cache: the cache puts
      # files in $WS/.lake, and `git clone` refuses to clone into a non-empty folder.
      - name: Clone the Prove2me workspace
        env:
          WS: ${{ steps.mode.outputs.workspace }}
        run: |
          [ -d "$WS/.git" ] || git clone -q https://github.com/prove2me/prove2me_workspace.git "$WS"

      # Restore Lean, the Mathlib download cache and the built workspace from an
      # earlier run. The exact key (Lean toolchain + Mathlib commit) is only known
      # after prepare.sh asks Prove2me for its current environment, so we restore
      # the newest cache with the right prefix here and save under the exact key
      # further down when it changed.
      - name: Restore Lean/Mathlib cache
        id: cache_restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            ~/prove2me_workspace/.lake
          key: lean-mathlib-${{ runner.os }}-unknown
          restore-keys: |
            lean-mathlib-${{ runner.os }}-

      - name: Install Lean toolchain and Mathlib (scripts/setup.sh)
        env:
          # setup.sh is time-boxed for the routine's 5-minute snapshot; on Actions
          # there is no such limit, so give it more room.
          P2M_SETUP_BUDGET_SECONDS: "1500"
        run: |
          bash scripts/setup.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Write credentials, pin environment, smoke-test Lean (scripts/prepare.sh)
        id: prepare
        env:
          # The only step that sees the Prove2me secret. prepare.sh writes it to
          # $PROVE2ME_WORKSPACE/credentials.json (mode 600) and never prints it.
          PROVE2ME_CREDENTIALS: ${{ secrets.PROVE2ME_CREDENTIALS }}
        run: |
          set +e
          bash scripts/prepare.sh
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case $rc in
            0) ;;
            3) echo "::error::Prove2me credentials missing or rejected. Set the PROVE2ME_CREDENTIALS secret to the whole credentials.json." ;;
            *) echo "::error::Lean/Mathlib setup failed (exit $rc). See the log above." ;;
          esac
          exit 0   # do not stop the job; later steps still write and publish a log

      - name: Compute exact cache key
        id: cache_key
        if: steps.prepare.outputs.rc == '0'
        run: |
          WS="$PROVE2ME_WORKSPACE"
          TC="$(tr -c 'A-Za-z0-9.\n' '-' < "$WS/lean-toolchain" | head -1)"
          REV="$(grep -oE '[0-9a-f]{40}' "$WS/lakefile.lean" | head -1)"
          echo "key=lean-mathlib-${RUNNER_OS}-${TC}-${REV}" >> "$GITHUB_OUTPUT"

      # Save right away (before Claude runs), so the cache holds a clean Mathlib
      # build and is kept even if the Claude step fails later. GitHub keeps up to
      # 10 GB of caches per repo and evicts the least recently used ones.
      - name: Save Lean/Mathlib cache (only when it changed)
        if: >-
          steps.prepare.outputs.rc == '0' &&
          steps.cache_restore.outputs.cache-matched-key != steps.cache_key.outputs.key
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            ~/prove2me_workspace/.lake
          key: ${{ steps.cache_key.outputs.key }}

      # ---------------------------------------------------------------- logs from earlier runs
      # p2m.py skips claims already attempted in earlier runs by reading logs/*.jsonl.
      # Those logs live on the `autoprover-log` branch, so copy them into the working
      # tree here (read-only; main is not modified).
      - name: Restore earlier run logs from the autoprover-log branch
        run: |
          if git fetch -q --depth=1 origin +refs/heads/autoprover-log:refs/remotes/origin/autoprover-log 2>/dev/null; then
            git restore --source=origin/autoprover-log --worktree -- logs 2>/dev/null || true
          fi
          ls logs 2>/dev/null | wc -l | xargs echo "earlier log files:"

      # ---------------------------------------------------------------- Claude
      # Read prompts/routine.md into a step output. The random delimiter makes
      # this safe for any multi-line text.
      - name: Load the agent prompt
        id: prompt
        if: steps.prepare.outputs.rc == '0'
        run: |
          DELIM="PROMPT_EOF_$(openssl rand -hex 12)"
          {
            echo "text<<$DELIM"
            cat prompts/routine.md
            echo
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (the autoprover agent)
        id: claude
        if: steps.prepare.outputs.rc == '0'
        # Keep going if Claude fails or hits a limit: the log steps below must run.
        continue-on-error: true
        # Leave time inside the 300-minute job for setup (above) and logging (below).
        timeout-minutes: 230
        uses: anthropics/claude-code-action@v1
        env:
          # Bash tool: allow long foreground commands (Lean builds), 20 min default / 60 min max.
          BASH_DEFAULT_TIMEOUT_MS: "1200000"
          BASH_MAX_TIMEOUT_MS: "3600000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Passing the workflow's own read-only token means the Claude GitHub App
          # does not have to be installed and no id-token permission is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          # Claude Code CLI flags:
          #   --model           which Claude model to use
          #   --max-turns       stop after this many agent turns
          #   --max-budget-usd  stop once Claude Code's *estimated* API-price spend
          #                     reaches this. With a subscription token you are not
          #                     billed in dollars; it is only a soft cap on how much
          #                     of your usage allowance one run can burn.
          #   --add-dir         let file tools reach the Lean workspace outside the repo
          #   --allowedTools    the only tools Claude may use (no MCP/GitHub tools)
          claude_args: |
            --model ${{ steps.mode.outputs.model }}
            --max-turns 200
            --max-budget-usd ${{ vars.AUTOPROVER_MAX_BUDGET_USD || '50' }}
            --add-dir ${{ steps.mode.outputs.workspace }}
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # ---------------------------------------------------------------- after
      # Best effort: did Claude stop because the subscription usage limit was hit?
      # We look only at the last few messages of the action's execution file
      # (a JSON list of messages in $RUNNER_TEMP), so text inside Lean output or
      # theorem statements earlier in the run does not cause false alarms.
      - name: Detect Claude usage limit
        id: usage
        if: always() && steps.prepare.outputs.rc == '0'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os, re
          path = os.environ.get("EXEC_FILE") or os.path.join(os.environ["RUNNER_TEMP"], "claude-execution-output.json")
          pat = re.compile(r"usage limit|limit reached|hit your (usage |weekly |session )?limit|"
                           r"out of (extra )?usage|rate_limit_error", re.I)
          hit, snippet = False, ""
          try:
              msgs = json.load(open(path))
              tail = json.dumps(msgs[-6:], ensure_ascii=False) if isinstance(msgs, list) else ""
              m = pat.search(tail)
              if m:
                  hit = True
                  snippet = tail[max(0, m.start() - 120): m.end() + 120].replace("\n", " ")
          except Exception as e:
              print(f"could not read execution file ({e}); skipping usage-limit check")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"hit={'true' if hit else 'false'}\n")
          if hit:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("\n> **Claude usage limit reached.** The agent stopped early; "
                           "the next scheduled run will continue after the limit resets.\n>\n"
                           f"> `{snippet[:300].replace('`', '')}`\n\n")
              print("::warning::Claude usage limit reached (detected in the execution log)")
          PY

      # Make sure this run has a log, even if Claude never got to write one.
      - name: Write run summary (scripts/p2m.py summary), if missing
        if: always()
        env:
          PREP_RC: ${{ steps.prepare.outputs.rc }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          USAGE_HIT: ${{ steps.usage.outputs.hit }}
        run: |
          RID=""; [ -f .autoprover/run_id ] && RID="$(cat .autoprover/run_id)"
          if [ -n "$RID" ] && [ -f "logs/$RID.md" ]; then
            echo "agent already wrote logs/$RID.md"
            if [ "$USAGE_HIT" = "true" ] && ! grep -q "usage limit" "logs/$RID.md"; then
              printf '\nNote (workflow): Claude usage limit reached during this run.\n' >> "logs/$RID.md"
            fi
          else
            if   [ "$PREP_RC" = "3" ]; then REASON="Prove2me credentials missing or rejected: update the PROVE2ME_CREDENTIALS secret"
            elif [ -n "$PREP_RC" ] && [ "$PREP_RC" != "0" ]; then REASON="Lean/Mathlib setup failed (prepare.sh exit $PREP_RC)"
            elif [ "$USAGE_HIT" = "true" ]; then REASON="Claude usage limit reached"
            elif [ "$CLAUDE_OUTCOME" = "failure" ]; then REASON="Claude step failed or hit max turns/budget/timeout before writing a summary"
            else REASON="agent ended without writing a summary (written by the workflow)"
            fi
            python3 scripts/p2m.py summary --stop-reason "$REASON" > /dev/null \
              || echo "::warning::p2m.py summary failed"
          fi

      - name: Show the run log on this page
        id: collect
        if: always()
        run: |
          RID="$(cat .autoprover/run_id 2>/dev/null || true)"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          if [ -n "$RID" ] && [ -f "logs/$RID.md" ]; then
            { echo; cat "logs/$RID.md"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No run log was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only this run's two log files (the publish-log job commits them).
      - name: Upload this run's log files
        if: always() && steps.collect.outputs.run_id != ''
        uses: actions/upload-artifact@v7
        with:
          name: run-logs
          path: |
            logs/${{ steps.collect.outputs.run_id }}.md
            logs/${{ steps.collect.outputs.run_id }}.jsonl
          if-no-files-found: ignore
          retention-days: 7

      # Dry-run proofs that passed every local check (download from the run page).
      # Only this folder is uploaded: the rest of .autoprover/ holds a cached
      # Prove2me access token and must never be published.
      - name: Upload dry-run solutions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-solutions
          path: .autoprover/dry_run_solutions/
          include-hidden-files: true   # the path starts with a dot
          if-no-files-found: ignore
          retention-days: 30

  # Commit the log to branch `autoprover-log` (created on first use). Separate job so
  # the write permission never exists while the agent is running. Uses a git
  # worktree, so `main` is never checked out for writing or modified.
  publish-log:
    needs: prove
    if: always() && needs.prove.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push to the autoprover-log branch with GITHUB_TOKEN
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download this run's log files
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: run-logs
          path: ${{ runner.temp }}/newlogs

      - name: Commit and push to autoprover-log
        if: steps.dl.outcome == 'success'
        env:
          RID: ${{ needs.prove.outputs.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/newlogs/*)
          [ ${#files[@]} -gt 0 ] || { echo "nothing to publish"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LB="$RUNNER_TEMP/logbranch"
          if git ls-remote --exit-code --heads origin autoprover-log >/dev/null; then
            git fetch -q origin +refs/heads/autoprover-log:refs/remotes/origin/autoprover-log
            git worktree add -q -B autoprover-log "$LB" origin/autoprover-log
          else
            # First run: create an empty branch with no files from main.
            git worktree add -q --detach "$LB"
            git -C "$LB" checkout -q --orphan autoprover-log
            git -C "$LB" rm -rfq . || true
          fi
          mkdir -p "$LB/logs"
          cp "${files[@]}" "$LB/logs/"
          git -C "$LB" add -f logs
          if git -C "$LB" diff --cached --quiet; then echo "log unchanged"; exit 0; fi
          git -C "$LB" commit -q -m "autoprover run $RID"
          for i in 1 2 3; do
            git -C "$LB" push -q origin HEAD:refs/heads/autoprover-log && exit 0
            echo "push rejected, rebasing and retrying ($i)"
            git -C "$LB" fetch -q origin +refs/heads/autoprover-log:refs/remotes/origin/autoprover-log
            git -C "$LB" rebase -q origin/autoprover-log
          done
          echo "::error::could not push the log to autoprover-log"; exit 1
